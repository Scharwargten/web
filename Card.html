<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"> 

    <style>
        .card-img-top {
           object-fit: cover;
           height: 580px;
           background-color: #f8f9fa;
           width: 100%;
        }
    </style>
</head>

<header class="bg-black py-4">
    <div class="container d-flex justify-content-center">
        <img src="big.png" alt="Logo" style="height:200px;" style="width: 100%;">
    </div>
</header>

<body class="bg-dark">
    <div class="container py-5">
        <h1 class="text-center mb-5 text-light">Colete sua recompensa</h1>

        <div class="row">
            <!--Card 1-->
            <div class="col-md-4 mb-3">
                <div class="card">
                      <img src="Desenhos Delicados.jpg" class="card-img-top" alt="Recompensa">
                      <div class="card-body text-center"></div>
                      <h5 class="card-title text-center text-black fw-bold">Kaidou</h5>
                      <h5  class="alert alert-warning py-1 text-center text-black fw-bold" role="alert">R$4.611.100,00</h5>
                </div>
            </div>
             
            <!--Card 2-->
            <div class="col-md-4 mb-3">
                <div class="card">
                      <img src="Captura de tela 2026-03-05 095935.png" class="card-img-top" alt="Recompensa">
                      <div class="card-body text-center"></div>
                      <h5 class="card-title text-center text-black fw-bold">Luffy</h5>
                      <h5 class="alert alert-warning py-1 text-center text-black fw-bold" role="alert">R$3.000.000,00</h5>
                </div>
            </div>
                
            <!--Card 3-->
            <div class="col-md-4 mb-3">
                <div class="card">
                      <img src="Captura de tela 2026-03-05 100028.png" class="card-img-top" alt="Recompensa">
                      <div class="card-body text-center"></div>
                      <h5 class="card-title text-center text-black fw-bold">Barba Negra</h5>
                      <h5 class="alert alert-warning py-1 text-center text-black fw-bold" role="alert">R$2.247.600,00</h5>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card">
                      <img src="Captura de tela 2026-03-05 100118.png" class="card-img-top" alt="Recompensa">
                      <div class="card-body text-center"></div>
                      <h5 class="card-title text-center text-black fw-bold">Nico Robin</h5>
                      <h5 class="alert alert-warning py-1 text-center text-black fw-bold" role="alert">R$930.000,00</h5>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card">
                      <img src="Captura de tela 2026-03-05 100159.png" class="card-img-top" alt="Recompensa">
                      <div class="card-body text-center"></div>
                      <h5 class="card-title text-center text-black fw-bold">Barba Branca</h5>
                      <h5 class="alert alert-warning py-1 text-center text-black fw-bold" role="alert">R$5.046.000,00</h5>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card">
                      <img src="one piece poster crocodile.jpg" class="card-img-top" alt="Recompensa">
                      <div class="card-body text-center"></div>
                      <h5 class="card-title text-center text-black fw-bold">Crocodile</h5>
                      <h5 class="alert alert-warning py-1 text-center text-black fw-bold" role="alert">R$1.965.000,00</h5>
                </div>
            </div>

        </div>
    </div> 

     <footer class="bg-white text-dark py-4 mt-auto">
        <div class="container text-center">
            &copy; 2026 - Todos os direitos reservados   shot.
        </div>
     </footer>
</body>
</html>
