<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"> 
    <style>
        .card img{
           object-fit: cover;
           height: 580px;
        }

        .fundo  {
            background-color: black;
            color: white;
        }
    </style>
</head>
<body class="bg-dark">
    <div class="container py-5">

                      <h5 class="card-title text-center text-black fw-bold">Kaidou</h5>
                      <h5  class="alert alert-info py-1 text-center text-black fw-bold" role="alert">R$4.611.100,00</h5>
                </div>
            </div>
             
            <!--Card 2-->
            <div class="col-md-4 mb-3">
